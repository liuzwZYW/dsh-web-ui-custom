name: publish

# 发布到 npm：推送 v* 标签时触发，也可以在 Actions 页面手动运行。
#
# 需要在仓库 Settings → Secrets and variables → Actions 里添加 NPM_TOKEN：
#   npmjs.com → Access Tokens → 新建 **Automation** token（或 Granular token，
#   勾选 read/write packages + 允许绕过 2FA），然后把它存成仓库 secret。
#
# 2FA：只有 Automation / 带 bypass-2FA 的 Granular token 才能在 CI 里免验证码发布。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance 需要 OIDC

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Smoke check
        run: |
          node --check index.js
          node --check client.js
          bash -n install.sh
          bash -n uninstall.sh

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$want" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package version ${want}"
            exit 1
          fi

      - name: Publish
        run: pnpm publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "Published \`${name}@${version}\` to npm." >> "$GITHUB_STEP_SUMMARY"
