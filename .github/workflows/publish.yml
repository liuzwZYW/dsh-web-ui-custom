name: publish

# 用 npm Trusted Publisher（OIDC）发布，不需要任何长期 token。
#
# 触发：推送 v* 标签，或在 Actions 页面手动 workflow_dispatch。
#
# 前置条件（一次性）：
#   1. 包必须已经存在于 npm registry —— 首次发版要先手工 bootstrap 一次；
#   2. 在 npmjs.com → 包 → Settings → Trusted publishing 添加：
#        Provider: GitHub Actions
#        Organization or user: liuzwZYW
#        Repository: dsh-web-ui-custom
#        Workflow filename: publish.yml
#        Allowed actions: 勾选 npm publish
#      配置后 2 天内必须完成一次成功发布，否则配置过期（可删除重建）。
#   3. 工作流文件名必须与 npm 上填写的完全一致（本文件必须叫 publish.yml）。
#
# 说明：Trusted publishing 要求 npm CLI >= 11.5.1、Node >= 22.14，这里用 Node 24。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC：npm 用它换取一次性发布凭据，并自动生成 provenance

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: npm version
        run: npm --version

      - name: Smoke check
        run: |
          node --check index.js
          node --check client.js
          bash -n install.sh
          bash -n uninstall.sh

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$want" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package version ${want}"
            exit 1
          fi

      # OIDC 由 npm CLI 自动识别：id-token 存在时先尝试可信发布凭据，
      # 失败才回退到 token。这里不配置任何 NODE_AUTH_TOKEN。
      - name: Publish
        run: npm publish --access public

      - name: Summary
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "Published \`${name}@${version}\` via trusted publishing." >> "$GITHUB_STEP_SUMMARY"
